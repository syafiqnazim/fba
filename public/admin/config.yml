backend:
  name: github
  repo: your-org/fba-site # TODO: replace with your GitHub owner/repo
  branch: main
  base_url: https://fba.my # OAuth gateway origin (see README)
  auth_endpoint: api/auth # relative to base_url if you host an OAuth proxy

media_folder: public/images/blog
public_folder: /images/blog

local_backend: true

collections:
  - name: blog_ms
    label: Blog (Bahasa Malaysia)
    folder: content/blog/ms
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: publishedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: Locale, name: locale, widget: hidden, default: ms }
      - { label: Slug, name: slug, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: blog_en
    label: Blog (English)
    folder: content/blog/en
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: publishedAt, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: Locale, name: locale, widget: hidden, default: en }
      - { label: Slug, name: slug, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }
